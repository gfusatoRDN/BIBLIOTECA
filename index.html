<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Biblioteca di Vanna e Giorgio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Cormorant+SC:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --paper:#f4eee1; --paper2:#efe7d6; --ink:#2a2622; --muted:#6f655a;
  --bord:#7a1f2b; --bord-d:#5d1620; --gold:#b08d57; --line:#d8cdb8;
  --card:#fbf7ee; --shadow:0 1px 2px rgba(42,38,34,.10),0 12px 28px rgba(42,38,34,.10);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'EB Garamond',Georgia,serif;
  font-size:18px; line-height:1.5;
  background-image:
    radial-gradient(circle at 18% 12%, rgba(176,141,87,.07), transparent 60%),
    radial-gradient(circle at 88% 78%, rgba(122,31,43,.06), transparent 55%);
}
/* subtle paper grain */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.4;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/></svg>");
  mix-blend-mode:multiply;
}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 22px 80px}

.brand-logo{position:absolute;top:26px;right:24px;z-index:6;max-height:84px;max-width:140px;
  width:auto;height:auto;object-fit:contain;
  filter:drop-shadow(0 2px 6px rgba(42,38,34,.18));opacity:.96}
@media(max-width:760px){ .brand-logo{max-height:54px;max-width:92px;top:16px;right:14px} }

header.masthead{padding:54px 0 26px;text-align:center}
.kicker{font-family:'Cormorant SC','Cormorant Garamond',serif;letter-spacing:.42em;text-transform:uppercase;
  font-size:.74rem;color:var(--bord);margin-bottom:14px}
h1{font-family:'Cormorant Garamond',serif;font-weight:600;line-height:.98;margin:0;
  font-size:clamp(2.6rem,7vw,5.2rem);letter-spacing:.01em}
h1 .amp{font-style:italic;color:var(--gold);font-weight:500}
.rule{display:flex;align-items:center;justify-content:center;gap:16px;margin:20px auto 8px;max-width:520px;color:var(--bord)}
.rule::before,.rule::after{content:"";height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);flex:1}
.rule .dot{width:7px;height:7px;border:1px solid var(--bord);transform:rotate(45deg)}
.tagline{font-style:italic;color:var(--muted);font-size:1.12rem;margin:6px 0 0}
.count{font-family:'Cormorant SC',serif;letter-spacing:.14em;font-size:1.1rem;font-weight:600;color:var(--bord);margin-top:14px}

/* controls */
.controls{position:sticky;top:0;z-index:5;margin:26px 0 8px;padding:16px;border-radius:4px;
  background:rgba(250,247,238,.86);backdrop-filter:blur(8px);
  border:1px solid var(--line);box-shadow:var(--shadow);
  display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr .9fr;gap:12px;align-items:end}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-family:'Cormorant SC',serif;letter-spacing:.12em;text-transform:uppercase;
  font-size:.98rem;font-weight:600;color:var(--bord)}
.field input,.field select{
  font-family:'EB Garamond',serif;font-size:1rem;color:var(--ink);
  padding:9px 11px;border:1px solid var(--line);border-radius:3px;background:#fffdf8;width:100%}
.field input:focus,.field select:focus{outline:none;border-color:var(--bord);box-shadow:0 0 0 3px rgba(122,31,43,.10)}
.modes{display:flex;gap:0;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.modes button{flex:1;border:0;background:#fffdf8;color:var(--muted);cursor:pointer;
  font-family:'Cormorant SC',serif;letter-spacing:.08em;font-size:.72rem;padding:9px 4px;text-transform:uppercase}
.modes button.active{background:var(--bord);color:#fff}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:14px 2px 22px;flex-wrap:wrap}
.status{font-style:italic;color:var(--muted);font-size:.92rem}
.reset{background:none;border:0;color:var(--bord);cursor:pointer;font-family:'EB Garamond',serif;
  font-size:.98rem;font-style:italic;text-decoration:underline;text-underline-offset:3px}
.loadbtn{font-family:'Cormorant SC',serif;letter-spacing:.1em;text-transform:uppercase;font-size:.7rem;
  color:var(--muted);border:1px solid var(--line);background:#fffdf8;border-radius:3px;padding:7px 12px;cursor:pointer}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:30px 26px}
.group-title{grid-column:1/-1;margin:30px 0 4px;display:flex;align-items:baseline;gap:14px}
.group-title h2{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:1.9rem;margin:0;color:var(--bord-d)}
.group-title .gt-line{flex:1;height:1px;background:var(--line)}
.group-title .gt-n{font-family:'Cormorant SC',serif;font-size:.78rem;letter-spacing:.12em;color:var(--muted)}

.card{background:var(--card);border:1px solid var(--line);border-radius:3px;overflow:hidden;cursor:pointer;
  display:flex;flex-direction:column;box-shadow:var(--shadow);
  opacity:0;transform:translateY(12px);animation:rise .5s ease forwards;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-4px);box-shadow:0 2px 4px rgba(42,38,34,.12),0 20px 40px rgba(42,38,34,.16)}
@keyframes rise{to{opacity:1;transform:none}}
.cover{position:relative;aspect-ratio:2/3;width:100%;overflow:hidden;background:var(--ph,#e7decb)}
.cover img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .5s}
.cover img.on{opacity:1}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;
  padding:16px 14px;color:#fff7ea}
.ph::after{content:"";position:absolute;left:11px;top:8px;bottom:8px;width:3px;background:rgba(255,255,255,.35)}
.ph .pht{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:1.18rem;line-height:1.12;
  text-shadow:0 1px 2px rgba(0,0,0,.25)}
.ph .pha{font-style:italic;font-size:.92rem;opacity:.92}
.spinner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.6);font-style:italic;font-size:.8rem}
.meta{padding:13px 14px 16px;display:flex;flex-direction:column;gap:3px;flex:1}
.t{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:1.18rem;line-height:1.12}
.a{font-style:italic;color:var(--ink)}
.a span,.e span{cursor:pointer;border-bottom:1px dotted transparent}
.a span:hover,.e span:hover{border-bottom-color:var(--bord);color:var(--bord)}
.e{font-family:'Cormorant SC',serif;letter-spacing:.08em;text-transform:uppercase;font-size:.66rem;color:var(--muted);margin-top:4px}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.tag{align-self:flex-start;font-family:'Cormorant SC',serif;font-size:.82rem;font-weight:600;letter-spacing:.1em;
  color:#fff;background:var(--bord);border:1px solid var(--bord);border-radius:2px;padding:3px 9px}
.gtag{font-family:'Cormorant SC',serif;font-size:.72rem;letter-spacing:.06em;cursor:pointer;
  color:var(--bord);background:#fff;border:1px solid var(--line);border-radius:2px;padding:3px 8px}
.gtag:hover{border-color:var(--bord);background:#fbf3ec}
.note{font-size:.82rem;color:var(--muted);font-style:italic;margin-top:4px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);font-style:italic;padding:60px 0;font-size:1.2rem}
footer{text-align:center;color:var(--muted);font-size:.86rem;margin-top:60px;font-style:italic}
footer .fr{color:var(--bord);font-style:normal;font-family:'Cormorant SC',serif;letter-spacing:.16em;font-size:.7rem;text-transform:uppercase}

/* ---- detail modal ---- */
.overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  padding:24px;background:rgba(38,30,26,.55);backdrop-filter:blur(5px);animation:fade .25s ease}
.overlay[hidden]{display:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
.panel{position:relative;width:min(760px,100%);max-height:88vh;overflow:auto;background:var(--card);
  border:1px solid var(--line);border-radius:5px;box-shadow:0 30px 80px rgba(0,0,0,.4);
  animation:pop .3s cubic-bezier(.2,.8,.25,1)}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.closex{position:absolute;top:8px;right:14px;z-index:2;border:0;background:none;cursor:pointer;
  font-size:2rem;line-height:1;color:var(--muted);font-family:'EB Garamond',serif}
.closex:hover{color:var(--bord)}
.panel-grid{display:grid;grid-template-columns:230px 1fr;gap:28px;padding:30px}
.panel-cover{position:relative;border-radius:3px;overflow:hidden;background:var(--ph,#e7decb);
  aspect-ratio:2/3;box-shadow:var(--shadow);align-self:start}
.panel-cover img{width:100%;height:100%;object-fit:cover;display:block}
.panel-cover .ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:18px 16px;color:#fff7ea}
.panel-cover .ph .pht{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:1.35rem;line-height:1.1;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.panel-cover .ph .pha{font-style:italic}
.panel-body .d-shelf{font-family:'Cormorant SC',serif;letter-spacing:.16em;text-transform:uppercase;font-size:.66rem;color:var(--bord);margin-bottom:8px}
.panel-body h2{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:2.1rem;line-height:1.04;margin:0 0 6px}
.panel-body .d-author{font-style:italic;font-size:1.18rem;margin-bottom:4px}
.panel-body .d-ed{font-family:'Cormorant SC',serif;letter-spacing:.1em;text-transform:uppercase;font-size:.72rem;color:var(--muted)}
.panel-body .d-note{font-style:italic;color:var(--muted);font-size:.95rem;margin-top:10px}
.d-wiki{margin-top:18px;border-top:1px solid var(--line);padding-top:16px;min-height:22px}
.d-wiki .w-head{font-family:'Cormorant SC',serif;letter-spacing:.14em;text-transform:uppercase;font-size:.66rem;color:var(--bord);margin-bottom:7px}
.d-wiki .w-text{font-size:1.02rem;line-height:1.55}
.d-wiki .w-loading{font-style:italic;color:var(--muted)}
.d-wiki a{color:var(--bord)}
.d-links{margin-top:18px;display:flex;flex-wrap:wrap;gap:10px}
.d-links a{font-family:'Cormorant SC',serif;letter-spacing:.08em;text-transform:uppercase;font-size:.68rem;
  text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:8px 13px;background:#fffdf8;transition:.2s}
.d-links a:hover{border-color:var(--bord);color:var(--bord)}
@media(max-width:620px){ .panel-grid{grid-template-columns:1fr;gap:18px;padding:22px}
  .panel-cover{width:160px;justify-self:center} }

@media(max-width:760px){
  .controls{grid-template-columns:1fr 1fr;}
  .field.search{grid-column:1/-1}
}
</style>
</head>
<body>
<div class="wrap">
  <img class="brand-logo" src="logo.png" alt="Logo" onerror="this.style.display='none'">
  <header class="masthead">
    <div class="kicker">Catalogo della Casa</div>
    <h1>La Biblioteca di<br>Vanna <span class="amp">&amp;</span> Giorgio</h1>
    <div class="rule"><span class="dot"></span></div>
    <p class="tagline">Libri raccolti negli anni, scaffale dopo scaffale.</p>
    <div class="count" id="count"></div>
  </header>

  <section class="controls">
    <div class="field search">
      <label for="q">Cerca</label>
      <input id="q" type="search" placeholder="titolo, autore, editore…" autocomplete="off">
    </div>
    <div class="field">
      <label for="autore">Autore</label>
      <select id="autore"><option value="">— tutti —</option></select>
    </div>
    <div class="field">
      <label for="editore">Casa editrice</label>
      <select id="editore"><option value="">— tutte —</option></select>
    </div>
    <div class="field">
      <label for="genere">Genere</label>
      <select id="genere"><option value="">— tutti —</option></select>
    </div>
    <div class="field">
      <label>Ordina / Raggruppa</label>
      <div class="modes" id="modes">
        <button data-mode="griglia" class="active">Griglia</button>
        <button data-mode="autore">Autore</button>
        <button data-mode="editore">Editore</button>
        <button data-mode="genere">Genere</button>
      </div>
    </div>
  </section>

  <div class="toolbar">
    <span class="status" id="status"></span>
    <div style="display:flex;gap:14px;align-items:center">
      <button class="reset" id="reset" hidden>azzera filtri</button>
      <label class="loadbtn">Carica catalogo (CSV/JSON)
        <input id="file" type="file" accept=".csv,.json,.xlsx" hidden>
      </label>
    </div>
  </div>

  <main class="grid" id="grid"></main>

  <div class="overlay" id="overlay" hidden>
    <div class="panel" role="dialog" aria-modal="true" aria-labelledby="dTitle">
      <button class="closex" id="closeDetail" aria-label="Chiudi">&times;</button>
      <div class="panel-grid">
        <div class="panel-cover" id="dCover"></div>
        <div class="panel-body">
          <div class="d-shelf" id="dShelf"></div>
          <h2 id="dTitle"></h2>
          <div class="d-author" id="dAuthor"></div>
          <div class="d-ed" id="dEd"></div>
          <div class="d-note" id="dNote"></div>
          <div class="d-wiki" id="dWiki"></div>
          <div class="d-links" id="dLinks"></div>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <div class="fr">Bibliotheca · Vanna &amp; Giorgio</div>
    Le copertine, quando disponibili, sono recuperate da Open Library.
  </footer>
</div>

const PALETTE = ["#7a1f2b","#3c5148","#3a4a63","#6b4a2d","#5d4370","#2f5d5b","#7c5a1e","#5a2d3a","#384f2f","#4a3f6b"];
let BOOKS = [];
const state = {q:"", autore:"", editore:"", genere:"", mode:"griglia"};
const coverCache = new Map();

const $ = s => document.querySelector(s);
const norm = s => (s||"").toString().toLowerCase()
  .normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function hue(s){let h=0;for(const c of (s||""))h=(h*31+c.charCodeAt(0))>>>0;return PALETTE[h%PALETTE.length];}
function authorsOf(b){return (b.Autore||"").split(";").map(x=>x.trim()).filter(Boolean);}

function buildFilters(){
  const auth = new Set(), edit = new Set(), gen = new Set();
  BOOKS.forEach(b=>{authorsOf(b).forEach(a=>auth.add(a)); if((b.Editore||"").trim())edit.add(b.Editore.trim());
    if((b.Genere||"").trim())gen.add(b.Genere.trim());});
  const coll = new Intl.Collator("it");
  const fill = (sel, arr) => {
    const cur = sel.value;
    sel.innerHTML = '<option value="">'+(sel.id==="editore"?"— tutte —":"— tutti —")+'</option>'
      + arr.sort(coll.compare).map(v=>`<option>${esc(v)}</option>`).join("");
    sel.value = cur;
  };
  fill($("#autore"),[...auth]); fill($("#editore"),[...edit]); fill($("#genere"),[...gen]);
}
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function filtered(){
  const q = norm(state.q);
  return BOOKS.filter(b=>{
    if(state.autore && !authorsOf(b).includes(state.autore)) return false;
    if(state.editore && (b.Editore||"").trim() !== state.editore) return false;
    if(state.genere && (b.Genere||"").trim() !== state.genere) return false;
    if(q){
      const hay = norm([b.Titolo,b.Autore,b.Editore,b.Genere,b.Note,b.Scaffale].join(" "));
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

const coll = new Intl.Collator("it",{sensitivity:"base"});
function sortBooks(arr, key){
  return arr.slice().sort((a,b)=> coll.compare(a[key]||"~", b[key]||"~") || coll.compare(a.Titolo,b.Titolo));
}

function cardHTML(b,i){
  const ph = hue(b.Titolo);
  const auth = authorsOf(b).map(a=>`<span data-autore="${esc(a)}">${esc(a)}</span>`).join(", ") || "—";
  const ed = (b.Editore||"").trim();
  return `<article class="card" data-id="${b._id}" style="--ph:${ph};animation-delay:${Math.min(i*22,500)}ms">
    <div class="cover" data-title="${esc(b.Titolo)}" data-author="${esc(authorsOf(b)[0]||"")}" data-isbn="${esc(b.ISBN||"")}" data-url="${esc(b.Copertina||"")}">
      <div class="ph"><div class="pht">${esc(b.Titolo)}</div><div class="pha">${esc(authorsOf(b)[0]||"")}</div></div>
    </div>
    <div class="meta">
      <div class="t">${esc(b.Titolo)}</div>
      <div class="a">${auth}</div>
      ${ed?`<div class="e"><span data-editore="${esc(ed)}">${esc(ed)}</span></div>`:`<div class="e" style="opacity:.5">senza editore</div>`}
      ${b.Note?`<div class="note">${esc(b.Note)}</div>`:""}
      <div class="tagrow">
        <span class="tag">Scaffale ${esc(b.Scaffale||"—")}</span>
        ${b.Genere?`<span class="gtag" data-genere="${esc(b.Genere)}">${esc(b.Genere)}</span>`:""}
      </div>
    </div>
  </article>`;
}

function render(){
  const grid = $("#grid");
  let books = filtered();
  $("#count").textContent = BOOKS.length + " volumi in catalogo";
  const showing = books.length;
  $("#status").textContent = showing===BOOKS.length ? `${showing} volumi` : `${showing} volumi trovati su ${BOOKS.length}`;
  $("#reset").hidden = !(state.q||state.autore||state.editore||state.genere);

  if(!showing){ grid.innerHTML = `<div class="empty">Nessun libro corrisponde alla ricerca.</div>`; return; }

  let html="";
  if(state.mode==="griglia"){
    html = sortBooks(books,"Autore").map((b,i)=>cardHTML(b,i)).join("");
  } else {
    const key = state.mode==="autore" ? "Autore" : state.mode==="genere" ? "Genere" : "Editore";
    const groups = {};
    books.forEach(b=>{
      const ks = key==="Autore" ? (authorsOf(b).length?authorsOf(b):["—"])
               : key==="Genere" ? [ (b.Genere||"").trim() || "Saggistica varia" ]
               : [ (b.Editore||"").trim() || "Senza editore" ];
      ks.forEach(k=>{(groups[k]=groups[k]||[]).push(b);});
    });
    let i=0;
    Object.keys(groups).sort(coll.compare).forEach(k=>{
      html += `<div class="group-title"><h2>${esc(k)}</h2><span class="gt-line"></span><span class="gt-n">${groups[k].length}</span></div>`;
      html += sortBooks(groups[k],"Titolo").map(b=>cardHTML(b,i++)).join("");
    });
  }
  grid.innerHTML = html;
  observeCovers();
}

/* ---- cover loading (Open Library, lazy) ---- */
let io;
function observeCovers(){
  if(io) io.disconnect();
  io = new IntersectionObserver((ents)=>{
    ents.forEach(e=>{ if(e.isIntersecting){ loadCover(e.target); io.unobserve(e.target); } });
  },{rootMargin:"300px"});
  document.querySelectorAll(".cover").forEach(c=>io.observe(c));
}
// limit how many cover lookups run at once (avoids rate-limits / timeouts)
let active=0; const waiting=[];
function gate(fn){ return new Promise((res,rej)=>{ waiting.push({fn,res,rej}); pump(); }); }
function pump(){ while(active<5 && waiting.length){ const w=waiting.shift(); active++;
  Promise.resolve().then(w.fn).then(w.res,w.rej).finally(()=>{active--;pump();}); } }
const fetchJSON = u => gate(()=>fetch(u).then(r=>r.ok?r.json():null).catch(()=>null));

// keep only the main title for matching: drop subtitle after ". " and any "(...)"
function shortTitle(t){ return (t||"").replace(/\s*\(.*?\)\s*/g," ").split(/\s*[.:]\s+/)[0].trim() || (t||""); }

async function gbCover(title,author,isbn){
  let q = isbn ? ("isbn:"+isbn) : ('intitle:'+title + (author?(' inauthor:'+author):''));
  const d = await fetchJSON("https://www.googleapis.com/books/v1/volumes?country=IT&maxResults=4&q="+encodeURIComponent(q));
  if(!d||!d.items) return null;
  for(const it of d.items){
    const im = it.volumeInfo && it.volumeInfo.imageLinks;
    if(im){ let u = im.thumbnail||im.smallThumbnail; if(u) return u.replace(/^http:/,"https:").replace(/&edge=curl/,"")+"&img=1"; }
  }
  return null;
}
async function olCover(title,author,isbn){
  if(isbn) return `https://covers.openlibrary.org/b/isbn/${isbn}-M.jpg?default=false`;
  const p = new URLSearchParams({title:title, limit:"3"}); if(author) p.set("author",author);
  const d = await fetchJSON("https://openlibrary.org/search.json?"+p.toString());
  const doc = d && d.docs && d.docs.find(x=>x.cover_i);
  return doc ? `https://covers.openlibrary.org/b/id/${doc.cover_i}-M.jpg` : null;
}
async function resolveCoverData({title,author,isbn,url}){
  if(url) return url;
  isbn = (isbn||"").replace(/[^0-9Xx]/g,"");
  author = author||""; title = shortTitle(title);
  const key = title+"|"+author+"|"+isbn;
  if(coverCache.has(key)) return coverCache.get(key);
  let out=null;
  try{ out = await gbCover(title,author,isbn) || await olCover(title,author,isbn); }catch(e){}
  coverCache.set(key,out); return out;
}
function resolveCover(el){
  return resolveCoverData({title:el.dataset.title,author:el.dataset.author,isbn:el.dataset.isbn,url:el.dataset.url});
}
// turn a thumbnail URL into a larger version where possible
function bigCover(u){
  if(!u) return u;
  return u.replace(/-M\.jpg/,"-L.jpg").replace(/zoom=1/,"zoom=3");
}
// find a Wikipedia (Italian) article and return a short synopsis
async function wikiSummary(title,author){
  const q = shortTitle(title) + (author? " "+author.split(";")[0].trim() : "");
  const url = "https://it.wikipedia.org/w/api.php?origin=*&format=json&action=query"
    + "&generator=search&gsrlimit=1&gsrsearch="+encodeURIComponent(q)
    + "&prop=extracts|info&exintro=1&explaintext=1&exchars=750&inprop=url";
  try{
    const r = await fetch(url); const d = await r.json();
    const pages = d && d.query && d.query.pages; if(!pages) return null;
    const p = Object.values(pages)[0]; if(!p || !p.extract) return null;
    return {title:p.title, extract:p.extract.trim(), url:p.fullurl || ("https://it.wikipedia.org/?curid="+p.pageid)};
  }catch(e){ return null; }
}
function showCover(el,src){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{ el.querySelectorAll(".ph").forEach(n=>n.remove()); el.appendChild(img);
      requestAnimationFrame(()=>img.classList.add("on")); res(true); };
    img.onerror=()=>res(false);
    img.alt=el.dataset.title; img.src=src;
  });
}
async function loadCover(el){
  const src = await resolveCover(el);
  if(!src) return;
  const ok = await showCover(el,src);
  if(!ok){ // ISBN-based OpenLibrary guess can 404 -> try a real search as last resort
    const isbn=(el.dataset.isbn||"").replace(/[^0-9Xx]/g,"");
    if(isbn){ const alt = await olCover(shortTitle(el.dataset.title), el.dataset.author||"", "");
      if(alt) showCover(el,alt); }
  }
}

/* ---- data loading ---- */
function setBooks(arr){
  BOOKS = arr.filter(b=>b && (b.Titolo||"").trim());
  BOOKS.forEach((b,i)=>b._id=i);
  buildFilters(); render();
}
function rowsToBooks(rows){
  return rows.map(r=>{
    const o={}; for(const k in r){ o[k.trim()] = (r[k]==null?"":String(r[k]).trim()); }
    return {Autore:o.Autore||"", Titolo:o.Titolo||"", Editore:o.Editore||"",
            Scaffale:o.Scaffale||o.Anno||"", Genere:o.Genere||"", ISBN:o.ISBN||"", Copertina:o.Copertina||"", Note:o.Note||""};
  });
}
function csvToRows(text){
  const rows=[]; let row=[], field="", q=false;
  text=text.replace(/^\uFEFF/,"");
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c=='"'){ if(text[i+1]=='"'){field+='"';i++;} else q=false; }
      else field+=c;
    }else{
      if(c=='"') q=true;
      else if(c==',') { row.push(field); field=""; }
      else if(c=='\n'){ row.push(field); rows.push(row); row=[]; field=""; }
      else if(c=='\r'){}
      else field+=c;
    }
  }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  if(!rows.length) return [];
  const head=rows.shift().map(h=>h.trim());
  return rows.filter(r=>r.some(x=>x&&x.trim())).map(r=>{
    const o={}; head.forEach((h,i)=>o[h]=(r[i]||"").trim()); return o;
  });
}
async function tryLoadData(){
  for(const [name,kind] of [["libri.csv","csv"],["libri.json","json"]]){
    try{
      const r = await fetch(name,{cache:"no-store"});
      if(!r.ok) continue;
      const txt = await r.text();
      const rows = kind==="json" ? JSON.parse(txt) : csvToRows(txt);
      if(rows && rows.length){ setBooks(rowsToBooks(rows));
        $("#status").title="Dati caricati dal file "+name; return true; }
    }catch(e){}
  }
  return false;
}
$("#file").addEventListener("change", e=>{
  const f = e.target.files[0]; if(!f) return;
  const fr = new FileReader(); const name=(f.name||"").toLowerCase();
  fr.onload = ()=>{
    try{
      let rows;
      if(name.endsWith(".json")) rows=JSON.parse(fr.result);
      else if(name.endsWith(".csv")) rows=csvToRows(fr.result);
      else { const wb=XLSX.read(fr.result,{type:"binary"});
             rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""}); }
      setBooks(rowsToBooks(rows));
    }catch(err){ alert("File non leggibile: "+err); }
  };
  if(name.endsWith(".json")||name.endsWith(".csv")) fr.readAsText(f);
  else fr.readAsBinaryString(f);
});

/* ---- events ---- */
$("#q").addEventListener("input", e=>{state.q=e.target.value; render();});
$("#autore").addEventListener("change", e=>{state.autore=e.target.value; render();});
$("#editore").addEventListener("change", e=>{state.editore=e.target.value; render();});
$("#genere").addEventListener("change", e=>{state.genere=e.target.value; render();});
$("#modes").addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b)return;
  state.mode=b.dataset.mode;
  document.querySelectorAll("#modes button").forEach(x=>x.classList.toggle("active",x===b)); render(); });
$("#reset").addEventListener("click", ()=>{ state.q="";state.autore="";state.editore="";state.genere="";
  $("#q").value="";$("#autore").value="";$("#editore").value="";$("#genere").value=""; render(); });
$("#grid").addEventListener("click", e=>{
  const a=e.target.closest("[data-autore]"); const ed=e.target.closest("[data-editore]"); const g=e.target.closest("[data-genere]");
  if(a){ state.autore=a.dataset.autore; $("#autore").value=state.autore; render(); window.scrollTo({top:0,behavior:"smooth"}); return; }
  if(ed){ state.editore=ed.dataset.editore; $("#editore").value=state.editore; render(); window.scrollTo({top:0,behavior:"smooth"}); return; }
  if(g){ state.genere=g.dataset.genere; $("#genere").value=state.genere; render(); window.scrollTo({top:0,behavior:"smooth"}); return; }
  const card=e.target.closest(".card"); if(card){ const b=BOOKS.find(x=>String(x._id)===card.dataset.id); if(b) openDetail(b); }
});

/* ---- detail modal ---- */
let detailToken=0;
function openDetail(b){
  const tk=++detailToken;
  const a1 = authorsOf(b)[0]||"";
  $("#dShelf").textContent = "Scaffale "+(b.Scaffale||"—")+(b.Genere?"  ·  "+b.Genere:"");
  $("#dTitle").textContent = b.Titolo;
  $("#dAuthor").textContent = authorsOf(b).join(", ") || "Autore non identificato";
  $("#dEd").textContent = (b.Editore||"").trim() ? b.Editore : "Casa editrice non indicata";
  $("#dNote").textContent = b.Note || "";
  $("#dNote").style.display = b.Note ? "block":"none";

  const cov=$("#dCover");
  cov.style.setProperty("--ph", hue(b.Titolo));
  cov.innerHTML = `<div class="ph"><div class="pht">${esc(b.Titolo)}</div><div class="pha">${esc(a1)}</div></div>`;
  resolveCoverData({title:b.Titolo,author:a1,isbn:b.ISBN,url:b.Copertina}).then(src=>{
    if(tk!==detailToken || !src) return;
    const img=new Image();
    img.onload=()=>{ if(tk===detailToken){ cov.innerHTML=""; cov.appendChild(img); } };
    img.alt=b.Titolo; img.src=bigCover(src);
  });

  const qg = encodeURIComponent(shortTitle(b.Titolo)+(a1?(" "+a1):""));
  $("#dLinks").innerHTML =
    `<a href="https://it.wikipedia.org/w/index.php?search=${qg}" target="_blank" rel="noopener">Cerca su Wikipedia</a>`+
    `<a href="https://www.google.com/search?q=${qg}" target="_blank" rel="noopener">Cerca su Google</a>`+
    `<a href="https://www.google.com/search?tbm=bks&q=${qg}" target="_blank" rel="noopener">Google Libri</a>`;

  const w=$("#dWiki");
  w.innerHTML = `<div class="w-loading">Cerco la trama su Wikipedia…</div>`;
  wikiSummary(b.Titolo,a1).then(res=>{
    if(tk!==detailToken) return;
    if(res && res.extract){
      w.innerHTML = `<div class="w-head">Da Wikipedia — ${esc(res.title)}</div>`+
        `<div class="w-text">${esc(res.extract)} <a href="${esc(res.url)}" target="_blank" rel="noopener">leggi la voce »</a></div>`;
    } else {
      w.innerHTML = `<div class="w-head">Trama</div>`+
        `<div class="w-text" style="color:var(--muted);font-style:italic">Nessuna voce trovata automaticamente. `+
        `<a href="https://it.wikipedia.org/w/index.php?search=${qg}" target="_blank" rel="noopener">Cerca su Wikipedia »</a></div>`;
    }
  });

  $("#overlay").hidden=false; document.body.style.overflow="hidden";
}
function closeDetail(){ $("#overlay").hidden=true; document.body.style.overflow=""; detailToken++; }
$("#closeDetail").addEventListener("click", closeDetail);
$("#overlay").addEventListener("click", e=>{ if(e.target.id==="overlay") closeDetail(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && !$("#overlay").hidden) closeDetail(); });

/* ---- boot ---- */
(async ()=>{ const ok = await tryLoadData(); if(!ok) setBooks(FALLBACK_BOOKS); })();
</script>
